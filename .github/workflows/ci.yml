name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://localhost:27017/resumedraft_test
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore Firebase service account key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 -d > serviceAccountKey.json

      # Includes the Gemini model-liveness checks (real API calls, deterministic pass/fail --
      # this is the specific test that would have caught this session's deprecated-model
      # incident before deploy, per the release-gate plan's B.2). A scheduled nightly/prod
      # canary is a separate follow-up for catching a model retired *after* the last push;
      # this only catches it at push/PR time.
      - name: Run tests
        run: python -m pytest tests/ -v

  # Deploys to the existing EC2/Docker Compose box via SSH -- the same commands run manually
  # all session (git pull && docker compose up -d --build). Every backend deploy before this
  # was manual with no pre-deploy check, which is how the deprecated-model bug, the missing
  # serviceAccountKey.json, and the undeployed Firestore rules incidents all happened. This
  # doesn't fix the "manual step forgotten" class of problem in general (see Roadmap.md's
  # release-gate plan, item D, for why SSH+EC2 itself isn't being replaced this pass -- GitHub
  # OIDC + AWS SSM SendCommand, no long-lived key, no inbound SSH, is the recommended next
  # step, not built here), but it does mean *this* deploy can no longer happen with failing
  # tests or without a working health check afterward.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: 98.80.105.34
        run: |
          mkdir -p ~/.ssh
          # Strip CRLF defensively -- the secret may have been set from a Windows machine
          # (Get-Content -Raw preserves \r\n), and OpenSSH rejects a PEM key with CRLF
          # line endings as malformed.
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -v -i ~/.ssh/deploy_key ubuntu@"$EC2_HOST" \
            "cd ~/app && git pull origin master && sudo docker compose up -d --build api worker beat"

      - name: Post-deploy health check
        env:
          EC2_HOST: 98.80.105.34
        run: |
          for attempt in $(seq 1 10); do
            if curl -sf "http://$EC2_HOST:8000/v1/health" > /dev/null; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Health check attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::Deploy succeeded but health check never passed -- investigate the api container immediately"
          exit 1
